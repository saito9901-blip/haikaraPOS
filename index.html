<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学祭POSシステム</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (ブラウザ上でJSXをコンパイル) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- importmap: Lucide IconsをCDNから読み込むための設定 -->
  <script type="importmap">
    {
      "imports": {
        "lucide-react": "https://esm.sh/lucide-react@0.294.0"
      }
    }
  </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
  
  <div id="root"></div>

  <!-- アプリのコード (Babelで変換) -->
  <script type="text/babel" data-type="module">
    import { 
      ShoppingCart, BarChart3, Settings, Calculator, 
      Trash2, Plus, Minus, Check, X, AlertCircle, 
      Trophy, Target, Clock, Coins, Download, Edit2, Image as ImageIcon,
      Store, ClipboardCheck, User, Undo2
    } from 'lucide-react';
    
    const { useState, useEffect, useMemo } = React;

    // --- 初期データ（空の状態からスタート） ---
    const initialItems = [];
    const initialStaff = [];

    // --- メインコンポーネント ---
    function App() {
      const [activeTab, setActiveTab] = useState('register');
      const [items, setItems] = useState(initialItems);
      const [cart, setCart] = useState([]);
      const [salesHistory, setSalesHistory] = useState([]);
      const [staff, setStaff] = useState(initialStaff);
      const [currentStaff, setCurrentStaff] = useState(initialStaff[0] || '');
      const [goalAmount, setGoalAmount] = useState(0);
      
      const [startCashCounts, setStartCashCounts] = useState({
        c10000: '', c5000: '', c1000: '', c500: '', c100: '', c50: '', c10: ''
      });
      const [endCashCounts, setEndCashCounts] = useState({
        c10000: '', c5000: '', c1000: '', c500: '', c100: '', c50: '', c10: ''
      });

      const [flavorModal, setFlavorModal] = useState({ isOpen: false, item: null });
      const [checkoutModal, setCheckoutModal] = useState({ isOpen: false, received: '' });
      const [luckyModal, setLuckyModal] = useState({ isOpen: false, message: '' });
      const [cancelModal, setCancelModal] = useState({ isOpen: false, sale: null });
      const [discountModal, setDiscountModal] = useState({ isOpen: false, amount: '' });
      const [lastDiscountAmount, setLastDiscountAmount] = useState('');

      useEffect(() => {
        if (staff.length > 0 && !staff.includes(currentStaff)) {
          setCurrentStaff(staff[0]);
        } else if (staff.length === 0) {
          setCurrentStaff('');
        }
      }, [staff, currentStaff]);

      const handleItemClick = (item) => {
        if (item.stock <= 0) return;
        if (item.flavors && item.flavors.length > 0) {
          setFlavorModal({ isOpen: true, item });
        } else {
          addToCart(item, null);
        }
      };

      const addToCart = (item, flavor) => {
        const cartItemId = Date.now().toString();
        setCart([...cart, { ...item, cartItemId, selectedFlavor: flavor, isDiscount: false }]);
        setFlavorModal({ isOpen: false, item: null });
      };

      const removeFromCart = (cartItemId) => setCart(cart.filter(item => item.cartItemId !== cartItemId));

      const applyDiscount = () => {
        const amountNum = Number(discountModal.amount);
        if (amountNum > 0) {
          const discountItem = {
            cartItemId: Date.now().toString(),
            name: '割引',
            price: -amountNum,
            isDiscount: true,
            category: '割引'
          };
          setCart([...cart, discountItem]);
          setLastDiscountAmount(discountModal.amount);
          setDiscountModal({ ...discountModal, isOpen: false });
        }
      };

      const cartTotal = cart.reduce((sum, item) => sum + item.price, 0);

      const openCheckout = () => {
        if (cart.length === 0) return;
        setCheckoutModal({ isOpen: true, received: '' });
      };

      const processCheckout = () => {
        if (!currentStaff) {
          alert("担当者が設定されていません！設定画面からスタッフを追加してください。");
          return;
        }
        const receivedNum = Number(checkoutModal.received) || 0;
        if (receivedNum < cartTotal) {
          alert("お預かり金額が足りません！");
          return;
        }
        const newSale = {
          id: Date.now(),
          time: new Date(),
          items: [...cart],
          total: cartTotal,
          staff: currentStaff
        };
        const updatedItems = items.map(item => {
          const soldCount = cart.filter(c => c.id === item.id).length;
          return { ...item, stock: Math.max(0, item.stock - soldCount) };
        });
        setItems(updatedItems);
        setSalesHistory([...salesHistory, newSale]);
        setCart([]);
        setCheckoutModal({ isOpen: false, received: '' });

        if ((salesHistory.length + 1) % 5 === 0) {
          setLuckyModal({ isOpen: true, message: `🎊おめでとうございます！🎊\n本日 ${salesHistory.length + 1} 人目のお客様です！\nトッピングおまけ等のサービスをどうぞ！` });
        }
      };

      const handleNumpadClick = (val) => {
        setCheckoutModal(prev => {
          let currentStr = String(prev.received || '');
          if (val === 'C') return { ...prev, received: '' };
          if (val === 'BS') return { ...prev, received: currentStr.slice(0, -1) };
          if (val === 'EXACT') return { ...prev, received: String(cartTotal) };
          if (typeof val === 'number') return { ...prev, received: String(val) };
          if (currentStr === '0' && val !== '00') currentStr = '';
          if (currentStr.length >= 7 && val !== 'C' && val !== 'BS') return prev;
          return { ...prev, received: currentStr + val };
        });
      };

      const validSales = salesHistory.filter(sale => !sale.isCancelled);
      const totalSales = validSales.reduce((sum, sale) => sum + sale.total, 0);
      const goalProgress = Math.min(goalAmount > 0 ? (totalSales / goalAmount) * 100 : 0, 100);

      const hourlyData = useMemo(() => {
        const hours = Array(12).fill(0).map((_, i) => ({ hour: i + 9, sales: 0 }));
        validSales.forEach(sale => {
          const hour = sale.time.getHours();
          const target = hours.find(h => h.hour === hour);
          if (target) target.sales += sale.total;
        });
        return hours;
      }, [validSales]);

      const maxHourlySales = Math.max(...hourlyData.map(d => d.sales), 1000);

      const staffRanking = useMemo(() => {
        const ranking = staff.map(s => ({ name: s, sales: 0 }));
        validSales.forEach(sale => {
          const target = ranking.find(r => r.name === sale.staff);
          if (target) target.sales += sale.total;
          else ranking.push({ name: sale.staff, sales: sale.total });
        });
        return ranking.sort((a, b) => b.sales - a.sales);
      }, [validSales, staff]);

      const confirmCancelSale = () => {
        if (!cancelModal.sale) return;
        const saleToCancel = cancelModal.sale;
        const updatedItems = items.map(item => {
          const returnedCount = saleToCancel.items.filter(c => c.id === item.id).length;
          if (returnedCount > 0 && item.stock !== '') {
            return { ...item, stock: Number(item.stock) + returnedCount };
          }
          return item;
        });
        setItems(updatedItems);
        setSalesHistory(prev => prev.map(s => 
          s.id === saleToCancel.id ? { ...s, isCancelled: true } : s
        ));
        setCancelModal({ isOpen: false, sale: null });
      };

      const [csvFileName, setCsvFileName] = useState('学祭売上データ');
      const handleExportCSV = () => {
        if (salesHistory.length === 0) {
          alert('出力する売上データがありません。');
          return;
        }
        const headers = ['取引時間', '内容', '売上金額', '担当スタッフ', 'ステータス'];
        const data = salesHistory.map(sale => {
          const time = sale.time.toLocaleTimeString();
          const itemsStr = sale.items.map(item => {
            let name = item.name;
            if (item.isDiscount) name = `【割引】${name}`;
            if (item.selectedFlavor) name += `(${item.selectedFlavor})`;
            return name;
          }).join(' / ');
          const status = sale.isCancelled ? "取消済" : "有効";
          return `"${time}","${itemsStr}",${sale.total},"${sale.staff}","${status}"`;
        });
        
        const csvContent = [headers.join(','), ...data].join('\n');
        const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `${csvFileName || '売上データ'}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const navItems = [
        { id: 'register', label: 'レジ', icon: <Calculator size={22} /> },
        { id: 'dashboard', label: '集計', icon: <BarChart3 size={22} /> },
        { id: 'close', label: 'レジ締め', icon: <ClipboardCheck size={22} /> },
        { id: 'settings', label: '設定', icon: <Settings size={22} /> },
      ];

      return (
        <div className="flex flex-col md:flex-row h-screen bg-gray-100 text-gray-800 font-sans overflow-hidden">
          {/* PC用サイドバー */}
          <aside className="hidden md:flex flex-col w-64 bg-indigo-900 text-white shadow-xl z-20 flex-shrink-0">
            <div className="p-5 border-b border-indigo-800/50">
              <h1 className="text-2xl font-black flex items-center tracking-wider text-white drop-shadow-md">
                <Store className="mr-3 text-yellow-400" size={28} /> 学祭POS
              </h1>
            </div>
            <nav className="flex-1 p-4 space-y-3">
              {navItems.map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center p-3 rounded-xl transition-all duration-200 ${
                    activeTab === item.id 
                      ? 'bg-indigo-600 text-white shadow-md font-bold scale-105' 
                      : 'text-indigo-200 hover:bg-indigo-800 hover:text-white'
                  }`}
                >
                  <span className="mr-3">{item.icon}</span>
                  {item.label}
                </button>
              ))}
            </nav>
          </aside>

          {/* メインコンテンツ */}
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden relative">
            <header className="bg-white border-b border-gray-200 p-3 flex justify-between items-center shadow-sm z-10 flex-shrink-0">
              <div className="md:hidden font-black text-indigo-900 flex items-center text-lg">
                <Store className="mr-2 text-indigo-600" size={20}/> POS
              </div>
              <div className="flex-1 flex justify-end items-center space-x-4 sm:space-x-6">
                <div className="w-40 sm:w-56 hidden sm:block">
                  <div className="flex justify-between text-xs mb-1 text-gray-500 font-bold">
                    <span>目標: {goalAmount.toLocaleString()}円</span>
                    <span className="text-indigo-600">{totalSales.toLocaleString()}円</span>
                  </div>
                  <div className="w-full bg-gray-200 rounded-full h-2">
                    <div className="bg-yellow-400 h-2 rounded-full transition-all duration-500 shadow-sm" style={{ width: `${goalProgress}%` }}></div>
                  </div>
                </div>
                <div className="flex items-center bg-gray-50 rounded-lg border border-gray-200 overflow-hidden">
                  <div className="px-2 sm:px-3 text-gray-500 bg-gray-100 flex items-center h-full border-r border-gray-200">
                    <User size={16} className="md:mr-1"/>
                    <span className="hidden md:inline text-xs font-bold">担当</span>
                  </div>
                  <select 
                    value={currentStaff}
                    onChange={(e) => setCurrentStaff(e.target.value)}
                    className="bg-transparent text-gray-800 border-none p-2 text-sm font-bold outline-none cursor-pointer hover:bg-gray-100 transition-colors"
                  >
                    {staff.length === 0 && <option value="">未設定</option>}
                    {staff.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              </div>
            </header>

            <main className="flex-1 overflow-hidden flex flex-col">
              {activeTab === 'register' && (
                <div className="flex flex-col md:flex-row h-full">
                  <div className="flex-1 p-3 sm:p-4 overflow-y-auto bg-gray-50 border-r border-gray-200">
                    <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4 pb-20 md:pb-0">
                      {items.map(item => (
                        <button
                          key={item.id}
                          onClick={() => handleItemClick(item)}
                          disabled={item.stock <= 0}
                          className={`relative rounded-2xl text-left transition-all duration-200 transform hover:-translate-y-1 active:translate-y-0 flex flex-col overflow-hidden border-2 ${
                            item.stock <= 0 
                              ? 'bg-gray-100 border-gray-200 opacity-60 cursor-not-allowed grayscale-[50%]' 
                              : 'bg-white border-transparent hover:border-indigo-300 shadow-md hover:shadow-lg'
                          }`}
                        >
                          {item.stock <= 0 && (
                            <div className="absolute inset-0 flex items-center justify-center bg-white/40 backdrop-blur-[2px] z-10">
                              <span className="bg-gray-800 text-white font-black py-1.5 px-6 rounded-full rotate-[-12deg] text-lg border-2 border-white shadow-xl">完売</span>
                            </div>
                          )}
                          {item.image ? (
                            <div className="h-24 sm:h-32 w-full bg-cover bg-center border-b border-gray-100 shrink-0" style={{ backgroundImage: `url(${item.image})` }} />
                          ) : (
                            <div className="h-24 sm:h-32 w-full bg-indigo-50/50 flex flex-col items-center justify-center border-b border-gray-100 text-indigo-300 shrink-0">
                               <ImageIcon size={32} className="mb-2 opacity-50" />
                               <span className="text-xs font-bold opacity-60">No Image</span>
                            </div>
                          )}
                          <div className="p-3 sm:p-4 flex-1 flex flex-col justify-between w-full">
                            <div>
                              <div className="text-[10px] sm:text-xs text-indigo-500 mb-1 font-black tracking-wider">{item.category}</div>
                              <div className="font-bold text-base sm:text-lg leading-tight mb-2 text-gray-800">{item.name}</div>
                            </div>
                            <div className="flex justify-between items-end mt-1">
                              <div className="text-lg sm:text-xl font-black text-indigo-900">¥{item.price}</div>
                              <div className={`text-[10px] sm:text-xs px-2 py-1 rounded-md font-bold ${item.stock < 10 && item.stock > 0 ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-gray-100 text-gray-600 border border-gray-200'}`}>
                                残 {item.stock}
                              </div>
                            </div>
                          </div>
                        </button>
                      ))}
                      
                      {items.length === 0 && (
                        <div className="relative rounded-2xl text-left flex flex-col overflow-hidden border-2 border-dashed border-gray-300 bg-white opacity-80 select-none">
                          <div className="absolute inset-0 flex items-center justify-center z-10 bg-white/50 backdrop-blur-[2px]">
                            <div className="text-center px-2">
                              <div className="bg-gray-800 text-white text-[10px] sm:text-xs font-black py-1.5 px-4 rounded-full shadow-lg mb-2 inline-block">
                                商品未登録
                              </div>
                              <p className="text-[10px] sm:text-xs font-bold text-gray-600">設定タブから<br/>追加してください</p>
                            </div>
                          </div>
                          <div className="h-24 sm:h-32 w-full bg-gray-100 flex flex-col items-center justify-center border-b border-gray-100 text-gray-300 shrink-0">
                             <ImageIcon size={32} className="mb-2 opacity-40" />
                             <span className="text-xs font-bold opacity-40">No Image</span>
                          </div>
                          <div className="p-3 sm:p-4 flex-1 flex flex-col justify-between w-full">
                            <div>
                              <div className="text-[10px] sm:text-xs text-gray-400 mb-1 font-black tracking-wider">例: フード</div>
                              <div className="font-bold text-base sm:text-lg leading-tight mb-2 text-gray-300">焼きそば</div>
                            </div>
                            <div className="flex justify-between items-end mt-1">
                              <div className="text-lg sm:text-xl font-black text-gray-300">¥400</div>
                              <div className="text-[10px] sm:text-xs px-2 py-1 rounded-md font-bold bg-gray-100 text-gray-400 border border-gray-200">
                                残 50
                              </div>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="w-full md:w-80 lg:w-96 bg-white flex flex-col h-full shadow-[-4px_0_15px_rgba(0,0,0,0.03)] flex-shrink-0 z-10">
                    <div className="p-4 bg-white border-b border-gray-100 flex justify-between items-center shrink-0">
                      <h2 className="text-lg font-black text-gray-800 flex items-center"><ShoppingCart className="mr-2 text-indigo-600" size={20}/> カート</h2>
                      <button onClick={() => setCart([])} className="text-xs text-red-500 flex items-center hover:bg-red-50 px-2 py-1.5 rounded-lg font-bold transition-colors border border-transparent hover:border-red-100">
                        <Trash2 size={14} className="mr-1" /> 全てクリア
                      </button>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-3 sm:p-4 space-y-2 bg-gray-50/50">
                      {cart.length === 0 ? (
                        <div className="flex flex-col items-center justify-center h-full text-gray-400">
                          <ShoppingCart size={48} className="mb-4 opacity-20" />
                          <p className="font-bold text-sm">注文がありません</p>
                          <p className="text-xs mt-1 opacity-70">左のメニューから追加してください</p>
                        </div>
                      ) : (
                        cart.map((cItem) => (
                          <div key={cItem.cartItemId} className="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-gray-200 animate-fade-in-up">
                            <div className="flex-1 min-w-0 pr-2">
                              <div className="font-bold text-sm text-gray-800 truncate">
                                {cItem.isDiscount && <span className="text-red-500 mr-1 bg-red-50 px-1 rounded">割</span>}
                                {cItem.name}
                              </div>
                              {cItem.selectedFlavor && (
                                <div className="text-[10px] sm:text-xs text-indigo-700 bg-indigo-50 inline-block px-1.5 py-0.5 rounded-md mt-1 font-bold border border-indigo-100">味: {cItem.selectedFlavor}</div>
                              )}
                            </div>
                            <div className="flex items-center space-x-3 shrink-0">
                              <div className={`font-black ${cItem.isDiscount ? 'text-red-500' : 'text-gray-800'}`}>
                                ¥{cItem.price}
                              </div>
                              <button onClick={() => removeFromCart(cItem.cartItemId)} className="text-gray-400 hover:text-red-500 bg-gray-100 hover:bg-red-100 rounded-full p-1.5 transition-colors">
                                <X size={14} />
                              </button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="bg-white p-4 sm:p-5 border-t border-gray-200 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)] shrink-0 rounded-t-2xl md:rounded-none relative z-20 pb-24 md:pb-5">
                      <button onClick={() => setDiscountModal({ isOpen: true, amount: lastDiscountAmount })} className="w-full mb-4 border-2 border-dashed border-indigo-200 text-indigo-600 py-2.5 rounded-xl font-bold hover:bg-indigo-50 active:bg-indigo-100 flex justify-center items-center transition-colors">
                        <Minus size={16} className="mr-1" /> 任意の金額で割引
                      </button>
                      <div className="flex justify-between items-end mb-4 px-1">
                        <div className="text-gray-500 font-bold text-sm">合計 <span className="bg-gray-100 px-2 py-0.5 rounded-full text-gray-700 ml-1">{cart.length}点</span></div>
                        <div className="text-4xl font-black text-indigo-700 tracking-tight">¥{cartTotal.toLocaleString()}</div>
                      </div>
                      <button 
                        onClick={openCheckout}
                        disabled={cart.length === 0}
                        className={`w-full py-4 rounded-2xl font-black text-lg flex justify-center items-center transition-all duration-200 ${
                          cart.length === 0 
                            ? 'bg-gray-200 text-gray-400 cursor-not-allowed' 
                            : 'bg-indigo-600 text-white shadow-lg hover:shadow-indigo-500/30 hover:-translate-y-1 active:translate-y-0 active:shadow-md'
                        }`}
                      >
                        <Calculator className="mr-2" /> お会計へ進む
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'dashboard' && <DashboardTab totalSales={totalSales} goalAmount={goalAmount} goalProgress={goalProgress} salesHistory={salesHistory} validSalesCount={validSales.length} hourlyData={hourlyData} maxHourlySales={maxHourlySales} staffRanking={staffRanking} csvFileName={csvFileName} setCsvFileName={setCsvFileName} handleExportCSV={handleExportCSV} onCancelSale={(sale) => setCancelModal({ isOpen: true, sale })} />}
              {activeTab === 'close' && <CashierCloseTab totalSales={totalSales} salesCount={validSales.length} startCounts={startCashCounts} setStartCounts={setStartCashCounts} endCounts={endCashCounts} setEndCounts={setEndCashCounts} />}
              {activeTab === 'settings' && <SettingsTab items={items} setItems={setItems} staff={staff} setStaff={setStaff} goalAmount={goalAmount} setGoalAmount={setGoalAmount} />}
            </main>
          </div>

          <nav className="md:hidden absolute bottom-0 left-0 w-full bg-white border-t border-gray-200 flex justify-around items-center shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-50 pb-safe">
            {navItems.map(item => (
              <button
                key={item.id}
                onClick={() => setActiveTab(item.id)}
                className={`flex flex-col items-center justify-center flex-1 py-3 transition-colors ${
                  activeTab === item.id ? 'text-indigo-600' : 'text-gray-400 hover:text-gray-600 hover:bg-gray-50'
                }`}
              >
                <div className={`mb-1 transition-transform ${activeTab === item.id ? 'scale-110' : 'scale-100'}`}>
                  {item.icon}
                </div>
                <span className={`text-[10px] font-bold ${activeTab === item.id ? 'text-indigo-600' : 'text-gray-500'}`}>
                  {item.label}
                </span>
                {activeTab === item.id && <div className="absolute top-0 w-8 h-1 bg-indigo-600 rounded-b-full"></div>}
              </button>
            ))}
          </nav>

          {flavorModal.isOpen && (
            <div className="fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center z-[9999] p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl animate-fade-in-up">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-black text-gray-800">{flavorModal.item.name}の味を選択</h3>
                  <button onClick={() => setFlavorModal({ isOpen: false, item: null })} className="p-2 bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200 hover:text-gray-800 transition-colors"><X size={20}/></button>
                </div>
                <div className="space-y-3">
                  {flavorModal.item.flavors.map(flavor => (
                    <button
                      key={flavor}
                      onClick={() => addToCart(flavorModal.item, flavor)}
                      className="w-full p-4 border-2 border-indigo-100 text-indigo-700 bg-indigo-50/50 rounded-2xl font-bold text-lg hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition-all active:scale-95 shadow-sm"
                    >
                      {flavor}
                    </button>
                  ))}
                </div>
              </div>

    function CashierCloseTab({ totalSales, salesCount, startCounts, setStartCounts, endCounts, setEndCounts }) {
      const moneyTypes = [
        { key: 'c10000', label: '10,000円', val: 10000 },
        { key: 'c5000', label: '5,000円', val: 5000 },
        { key: 'c1000', label: '1,000円', val: 1000 },
        { key: 'c500', label: '500円', val: 500 },
        { key: 'c100', label: '100円', val: 100 },
        { key: 'c50', label: '50円', val: 50 },
        { key: 'c10', label: '10円', val: 10 },
      ];

      const handleStartChange = (key, val) => {
        if (val === '') {
          setStartCounts({...startCounts, [key]: ''});
          return;
        }
        const num = parseInt(val, 10);
        if (!isNaN(num)) setStartCounts({...startCounts, [key]: num});
      };

      const handleEndChange = (key, val) => {
        if (val === '') {
          setEndCounts({...endCounts, [key]: ''});
          return;
        }
        const num = parseInt(val, 10);
        if (!isNaN(num)) setEndCounts({...endCounts, [key]: num});
      };

      const startCashTotal = moneyTypes.reduce((sum, mt) => sum + ((Number(startCounts[mt.key]) || 0) * mt.val), 0);
      const endCashTotal = moneyTypes.reduce((sum, mt) => sum + ((Number(endCounts[mt.key]) || 0) * mt.val), 0);
      const expectedCash = startCashTotal + totalSales;
      const difference = endCashTotal - expectedCash;

      return (
        <div className="p-4 md:p-6 h-full overflow-y-auto bg-gray-50 pb-24 md:pb-6 flex justify-center">
          <div className="w-full max-w-5xl">
            <h2 className="text-2xl font-black mb-6 flex items-center text-gray-800 tracking-tight"><Target className="mr-3 text-indigo-600" size={28}/> レジ締め・現金確認</h2>

                </h3>
                <div className="space-y-3">
                  {moneyTypes.map(item => (
                    <div key={`start-${item.key}`} className="flex items-center justify-between">
                      <label className="text-sm font-bold w-16 text-gray-600">{item.label}</label>
                      <div className="flex items-center space-x-2">
                        <input 
                          type="number" min="0" 
                          value={startCounts[item.key] !== undefined ? startCounts[item.key] : ''} 
                          onChange={(e) => handleStartChange(item.key, e.target.value)}
                          placeholder="0"
                          className="w-16 p-1.5 border border-gray-300 rounded-lg text-right focus:ring-2 focus:ring-indigo-500 outline-none font-bold bg-gray-50" 
                        />
                        <span className="text-gray-400 text-xs font-bold w-4">枚</span>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="mt-6 pt-4 border-t border-gray-100 flex justify-between items-center bg-gray-50 p-3 rounded-xl">
                  <span className="text-sm text-gray-600 font-bold">準備金合計</span>
                  <span className="text-xl font-black text-gray-800">¥{startCashTotal.toLocaleString()}</span>
                </div>
              </div>

              <div className="bg-indigo-50 p-6 rounded-2xl shadow-sm border border-indigo-100">
                <h3 className="font-black text-indigo-900 mb-4 flex items-center border-b border-indigo-200/50 pb-3">
                  <span className="bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-md mr-3 shadow-sm">Step 2</span> レジ内の現金
                </h3>
                <div className="space-y-3">
                  {moneyTypes.map(item => (
                    <div key={`end-${item.key}`} className="flex items-center justify-between">
                      <label className="text-sm font-bold w-16 text-indigo-800">{item.label}</label>
                      <div className="flex items-center space-x-2">
                        <input 
                          type="number" min="0" 
                          value={endCounts[item.key] !== undefined ? endCounts[item.key] : ''} 
                          onChange={(e) => handleEndChange(item.key, e.target.value)}
                          placeholder="0"
                          className="w-16 p-1.5 border-2 border-indigo-200 rounded-lg text-right focus:border-indigo-500 focus:ring-0 outline-none font-black text-indigo-900 bg-white shadow-sm" 
                        />
                        <span className="text-indigo-400 text-xs font-bold w-4">枚</span>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="mt-6 pt-4 border-t border-indigo-200/50 flex justify-between items-center bg-white p-3 rounded-xl shadow-sm">
                  <span className="text-sm text-indigo-800 font-bold">入力合計</span>
                  <span className="text-xl font-black text-indigo-700">¥{endCashTotal.toLocaleString()}</span>
                </div>
              </div>

              <div className="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex flex-col justify-between">
                <div>
                  <h3 className="font-black text-gray-800 mb-5 border-b border-gray-100 pb-3 text-lg">最終照合結果</h3>
                  <div className="space-y-4">
                    <div className="flex justify-between text-gray-500 font-bold text-sm items-center">
                      <span>① 準備金合計</span>
                      <span className="text-gray-800">¥{startCashTotal.toLocaleString()}</span>
                    </div>
                    <div className="flex justify-between text-gray-500 font-bold text-sm items-center border-b border-dashed border-gray-200 pb-4">
                      <span>② 本日の売上 <span className="bg-gray-100 px-1.5 py-0.5 rounded text-[10px] ml-1">{salesCount}件</span></span>
                      <span className="text-emerald-600">+ ¥{totalSales.toLocaleString()}</span>
                    </div>
                    <div className="pt-2">
                      <div className="flex justify-between font-bold text-gray-500 text-xs mb-1">あるべき現金</div>
                      <div className="flex justify-between font-black text-gray-800 text-2xl tracking-tight">
                        <span>理論値</span>
                        <span>¥{expectedCash.toLocaleString()}</span>
                      </div>
                    </div>
                    <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                      <div className="flex justify-between font-bold text-indigo-500 text-xs mb-1">実際の現金 (Step2)</div>
                      <div className="flex justify-between font-black text-indigo-700 text-2xl tracking-tight">
                        <span>実測値</span>
                        <span>¥{endCashTotal.toLocaleString()}</span>
                      </div>
                    </div>
                  </div>
                </div>
                
                <div className={`mt-6 p-5 rounded-2xl text-center shadow-inner border-2 ${
                  difference === 0 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-red-50 text-red-600 border-red-200'
                }`}>
                  {difference === 0 ? (
                    <div className="flex flex-col items-center justify-center">
                      <Check size={32} className="mb-2 text-emerald-500" /> 
                      <span className="font-black text-lg">誤差なし！完璧です</span>
                    </div>
                  ) : (
                    <div className="flex flex-col items-center">
                      <div className="flex items-center text-sm mb-2 font-bold opacity-80"><AlertCircle size={18} className="mr-1.5" /> 違算が発生しています</div>
                      <span className="text-3xl font-black tracking-tight">{difference > 0 ? '+' : ''}{difference.toLocaleString()} 円</span>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function SettingsTab({ items, setItems, staff, setStaff, goalAmount, setGoalAmount }) {
      const handleAddItem = () => {
        const newItem = { id: Date.now(), name: '', price: '', stock: '', category: '', flavors: [], image: null };
        setItems([...items, newItem]);
      };
      const handleRemoveItem = (id) => setItems(items.filter(item => item.id !== id));
      
      const updateItemField = (id, field, value) => {
        setItems(items.map(item => {
          if (item.id === id) {
            if (field === 'flavors_str') return { ...item, flavors: value.split(',').map(s => s.trim()).filter(Boolean), _rawFlavors: value };
            return { ...item, [field]: value };
          }
          return item;
        }));
      };

      const handleImageUpload = (id, event) => {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => updateItemField(id, 'image', reader.result);
          reader.readAsDataURL(file);
        }
      };

      const [newStaffName, setNewStaffName] = useState('');
      const handleAddStaff = () => {
        if (newStaffName.trim() && !staff.includes(newStaffName.trim())) {
          setStaff([...staff, newStaffName.trim()]);
          setNewStaffName('');
        }
      };
      const handleRemoveStaff = (index) => setStaff(staff.filter((_, i) => i !== index));
      const updateStaffName = (index, newName) => {
        const updated = [...staff];
        updated[index] = newName;
        setStaff(updated);
      };

      return (
        <div className="p-4 md:p-6 h-full overflow-y-auto bg-gray-50 pb-24 md:pb-6">
          <div className="max-w-6xl mx-auto">
            <h2 className="text-2xl font-black mb-6 flex items-center text-gray-800 tracking-tight"><Settings className="mr-3 text-indigo-600" size={28}/> 設定・管理</h2>
            
            <div className="grid md:grid-cols-2 gap-6 mb-8">
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h3 className="font-black text-gray-800 mb-4 flex items-center"><Target size={20} className="mr-2 text-indigo-500"/> 目標売上設定</h3>
                <div className="flex items-center space-x-4">
                  <div className="relative flex-1">
                    <span className="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 font-bold">¥</span>
                    <input 
                      type="number" value={goalAmount} onChange={(e) => setGoalAmount(Number(e.target.value))}
                      className="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white font-black text-xl outline-none transition-all"
                    />
                  </div>
                </div>
                <p className="text-xs text-gray-400 mt-3 font-bold">※ダッシュボードの進捗メーターに反映されます</p>
              </div>

              <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h3 className="font-black text-gray-800 mb-4 flex items-center"><User size={20} className="mr-2 text-indigo-500"/> スタッフ管理</h3>
                <div className="flex space-x-2 mb-4">
                  <input 
                    type="text" value={newStaffName} onChange={(e) => setNewStaffName(e.target.value)}
                    placeholder="例: 山田太郎" className="flex-1 p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
                  />
                  <button onClick={handleAddStaff} className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-xl text-sm font-bold whitespace-nowrap transition-colors shadow-sm">追加</button>
                </div>
                <div className="flex flex-wrap gap-2">
                  {staff.map((s, idx) => (
                    <div key={idx} className="flex items-center bg-gray-50 border border-gray-200 rounded-lg overflow-hidden group">
                      <input 
                        value={s} onChange={(e) => updateStaffName(idx, e.target.value)}
                        className="p-2 px-3 w-24 text-sm font-bold text-gray-700 bg-transparent outline-none focus:bg-white"
                      />
                      <button onClick={() => handleRemoveStaff(idx)} className="bg-gray-100 hover:bg-red-500 text-gray-400 hover:text-white p-2.5 transition-colors">
                        <X size={14} />
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <div>
                  <h3 className="font-black text-gray-800 flex items-center text-lg"><ShoppingCart size={20} className="mr-2 text-indigo-500"/> 商品メニュー設定</h3>
                  <p className="text-xs text-gray-400 mt-1 font-bold">レジ画面にリアルタイムで反映されます</p>
                </div>
                <button onClick={handleAddItem} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold flex items-center transition-colors shadow-sm w-full sm:w-auto justify-center">
                  <Plus size={18} className="mr-1" /> 新規商品を追加
                </button>
              </div>
              
              <div className="overflow-x-auto rounded-xl border border-gray-200">
                <table className="w-full text-left text-sm whitespace-nowrap">
                  <thead className="bg-gray-50 text-gray-500 border-b border-gray-200 uppercase text-xs tracking-wider">
                    <tr>
                      <th className="p-4 w-16 text-center font-bold">画像</th>
                      <th className="p-4 w-48 font-bold">商品名</th>
                      <th className="p-4 w-32 font-bold">カテゴリ</th>
                      <th className="p-4 w-28 font-bold">価格 (円)</th>
                      <th className="p-4 w-28 font-bold">在庫数</th>
                      <th className="p-4 font-bold">種類/味 (カンマ区切り)</th>
                      <th className="p-4 w-12 text-center font-bold">削除</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {items.map(item => (
                      <tr key={item.id} className="hover:bg-indigo-50/30 transition-colors">
                        <td className="p-3 text-center">
                          <label className="cursor-pointer block relative flex justify-center">
                            {item.image ? (
                              <div className="relative group">
                                <img src={item.image} alt="preview" className="w-12 h-12 object-cover rounded-xl border border-gray-200 shadow-sm" />
                                <div className="absolute inset-0 bg-black/50 rounded-xl flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                  <Edit2 size={14} className="text-white" />
                                </div>
                              </div>
                            ) : (
                              <div className="w-12 h-12 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl flex items-center justify-center text-gray-400 hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-400 transition-colors">
                                <Plus size={18} />
                              </div>
                            )}
                            <input type="file" accept="image/*" className="hidden" onChange={(e) => handleImageUpload(item.id, e)} />
                          </label>
                        </td>
                        <td className="p-3">
                          <input 
                            type="text" value={item.name} onChange={(e) => updateItemField(item.id, 'name', e.target.value)}
                            placeholder="例: 焼きそば"
                            className="w-full p-2.5 bg-gray-50 border border-transparent rounded-lg font-bold text-gray-800 focus:bg-white focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none transition-all"
                          />
                        </td>
                        <td className="p-3">
                          <input 
                            type="text" value={item.category} onChange={(e) => updateItemField(item.id, 'category', e.target.value)}
                            placeholder="例: フード"
                            className="w-full p-2.5 bg-gray-50 border border-transparent rounded-lg text-gray-600 font-bold focus:bg-white focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none transition-all"
                          />
                        </td>
                        <td className="p-3">
                          <input 
                            type="number" min="0" value={item.price} onChange={(e) => updateItemField(item.id, 'price', e.target.value === '' ? '' : Number(e.target.value))}
                            placeholder="0"
                            className="w-full p-2.5 bg-gray-50 border border-transparent rounded-lg text-right font-black text-indigo-700 focus:bg-white focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none transition-all"
                          />
                        </td>
                        <td className="p-3">
                          <input 
                            type="number" min="0" value={item.stock} onChange={(e) => updateItemField(item.id, 'stock', e.target.value === '' ? '' : Number(e.target.value))}
                            placeholder="0"
                            className={`w-full p-2.5 bg-gray-50 border border-transparent rounded-lg text-right font-black outline-none transition-all focus:bg-white focus:ring-2 ${item.stock !== '' && item.stock <= 0 ? 'text-red-600 focus:border-red-300 focus:ring-red-100' : 'text-gray-700 focus:border-indigo-300 focus:ring-indigo-100'}`}
                          />
                        </td>
                        <td className="p-3">
                          <input 
                            type="text" 
                            value={item._rawFlavors !== undefined ? item._rawFlavors : (item.flavors ? item.flavors.join(', ') : '')} 
                            onChange={(e) => updateItemField(item.id, 'flavors_str', e.target.value)}
                            placeholder="例: ソース, 塩, 激辛"
                            className="w-full p-2.5 bg-gray-50 border border-transparent rounded-lg text-gray-600 font-bold focus:bg-white focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none transition-all"
                          />
                        </td>
                        <td className="p-3 text-center">
                          <button onClick={() => handleRemoveItem(item.id)} className="p-2.5 text-gray-400 hover:text-white hover:bg-red-500 rounded-lg transition-colors">
                            <Trash2 size={18} />
                          </button>
                        </td>
                      </tr>
                    ))}
                    {items.length === 0 && (
                      <tr><td colSpan="7" className="p-8 text-center text-gray-400 font-bold bg-gray-50">商品がありません。「新規商品を追加」ボタンから追加してください。</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Reactをマウント ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
