<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>学祭POSシステム（返金・取消対応＆取扱説明書付き版）</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (ブラウザ上でJSXを即時コンパイル) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN設定 -->
  <script type="importmap">
    {
      "imports": {
        "lucide-react": "https://esm.sh/lucide-react@0.294.0"
      }
    }
  </script>
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    /* モバイルのタップ時ハイライト除去 */
    * { -webkit-tap-highlight-color: transparent; }
    /* スクロールバーのスタイリング */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(203, 213, 225, 0.9);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.9);
    }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 select-none antialiased">
  
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { 
      ShoppingCart, BarChart3, Settings, Calculator, 
      Trash2, Plus, Minus, Check, X, AlertCircle, 
      Trophy, Target, Clock, Coins, Download, Upload, Edit2, Image as ImageIcon,
      Store, ClipboardCheck, User, Undo2, Sparkles, Package, ChevronUp, ChevronDown, 
      RefreshCw, RotateCcw, AlertTriangle, ArrowRight, CornerDownLeft, BookOpen,
      HelpCircle, FileText, CheckCircle2, ShieldAlert
    } from 'lucide-react';
    
    const { useState, useEffect, useMemo, useRef } = React;

    const STORAGE_KEY = 'festival_pos_state_v3';
    const safeStorage = {
      get: (key) => {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          console.error('Storage read error:', e);
          return null;
        }
      },
      set: (key, val) => {
        try {
          localStorage.setItem(key, JSON.stringify(val));
          return true;
        } catch (e) {
          console.error('Storage write error:', e);
          return false;
        }
      },
      remove: (key) => {
        try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
      }
    };

    // 画像ファイル圧縮関数（localStorage容量パンクを防止）
    const compressImageFile = (file, maxSize = 240, quality = 0.75) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxSize) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              }
            } else {
              if (height > maxSize) {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

    const EMPTY_CASH_COUNTS = {
      c10000: '', c5000: '', c1000: '', c500: '', c100: '', c50: '', c10: '', c5: '', c1: ''
    };

    const SAMPLE_ITEMS = [
      { id: 101, name: '特製焼きそば', price: 400, stock: 80, category: 'フード', flavors: ['ソース', '塩ダレ', '旨辛'], _rawFlavors: 'ソース、塩ダレ、旨辛', image: null },
      { id: 102, name: 'フランクフルト', price: 250, stock: 60, category: 'フード', flavors: ['ケチャップ&マスタード', 'ケチャップのみ', 'なし'], _rawFlavors: 'ケチャップ&マスタード、ケチャップのみ、なし', image: null },
      { id: 103, name: 'シャカシャカポテト', price: 300, stock: 50, category: 'サイド', flavors: ['コンソメ', 'バター醤油', 'チーズ'], _rawFlavors: 'コンソメ、バター醤油、チーズ', image: null },
      { id: 104, name: 'ラムネ・ドリンク', price: 200, stock: 100, category: 'ドリンク', flavors: ['ラムネ', 'コーラ', 'オレンジ', 'お茶'], _rawFlavors: 'ラムネ、コーラ、オレンジ、お茶', image: null }
    ];

    const REFUND_REASONS = [
      'レジ打ち間違い・注文重複',
      'お客様都合の注文変更・キャンセル',
      '商品の品切れ・渡し間違い',
      '商品不良・容器の汚れや破損',
      'その他'
    ];

    function App() {
      const [isLoaded, setIsLoaded] = useState(false);
      const [activeTab, setActiveTab] = useState('register');
      const [selectedCategory, setSelectedCategory] = useState('すべて');

      // 永続化ステート
      const [items, setItems] = useState([]);
      const [salesHistory, setSalesHistory] = useState([]);
      const [staff, setStaff] = useState([]);
      const [currentStaff, setCurrentStaff] = useState('');
      const [goalAmount, setGoalAmount] = useState(50000);
      const [startCashCounts, setStartCashCounts] = useState(EMPTY_CASH_COUNTS);
      const [endCashCounts, setEndCashCounts] = useState(EMPTY_CASH_COUNTS);
      const [luckyConfig, setLuckyConfig] = useState({
        enabled: true,
        interval: 10,
        triggeredMilestones: []
      });

      // UI・モーダル制御ステート
      const [cart, setCart] = useState([]);
      const [mobileCartOpen, setMobileCartOpen] = useState(false);
      const [toast, setToast] = useState(null);

      const [flavorModal, setFlavorModal] = useState({ isOpen: false, item: null });
      const [checkoutModal, setCheckoutModal] = useState({ isOpen: false, received: '' });
      const [luckyModal, setLuckyModal] = useState({ isOpen: false, message: '' });
      const [discountModal, setDiscountModal] = useState({ isOpen: false, amount: '' });
      const [helpModalOpen, setHelpModalOpen] = useState(false);
      const [lastDiscountAmount, setLastDiscountAmount] = useState('50');
      const [csvFileName, setCsvFileName] = useState('学祭売上データ');

      // 返金・取消総合モーダル用ステート
      const [refundModal, setRefundModal] = useState({
        isOpen: false,
        sale: null,
        mode: 'full', // 'full' (全額取消) または 'partial' (一部返品)
        returnQuantities: {}, // { [cartItemId]: number }
        restock: true,       // 在庫を元に戻すか
        reason: REFUND_REASONS[0],
        customReason: ''
      });

      const showToast = (message, type = 'info') => {
        setToast({ message, type, id: Date.now() });
      };

      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 3600);
        return () => clearTimeout(timer);
      }, [toast]);

      useEffect(() => {
        const saved = safeStorage.get(STORAGE_KEY) || safeStorage.get('festival_pos_state_v2');
        if (saved) {
          if (Array.isArray(saved.items)) setItems(saved.items);
          if (Array.isArray(saved.salesHistory)) setSalesHistory(saved.salesHistory);
          if (Array.isArray(saved.staff)) setStaff(saved.staff);
          if (saved.currentStaff !== undefined) setCurrentStaff(saved.currentStaff);
          if (typeof saved.goalAmount === 'number') setGoalAmount(saved.goalAmount);
          if (saved.startCashCounts) setStartCashCounts({ ...EMPTY_CASH_COUNTS, ...saved.startCashCounts });
          if (saved.endCashCounts) setEndCashCounts({ ...EMPTY_CASH_COUNTS, ...saved.endCashCounts });
          if (saved.luckyConfig) setLuckyConfig({ enabled: true, interval: 10, triggeredMilestones: [], ...saved.luckyConfig });
        }
        setIsLoaded(true);
      }, []);

      useEffect(() => {
        if (!isLoaded) return;
        const success = safeStorage.set(STORAGE_KEY, {
          version: '3.1',
          updatedAt: new Date().toISOString(),
          items,
          salesHistory,
          staff,
          currentStaff,
          goalAmount,
          startCashCounts,
          endCashCounts,
          luckyConfig
        });
        if (!success) {
          showToast('ブラウザの保存容量上限に近づいています。不要な画像を整理してください。', 'error');
        }
      }, [items, salesHistory, staff, currentStaff, goalAmount, startCashCounts, endCashCounts, luckyConfig, isLoaded]);

      useEffect(() => {
        if (staff.length > 0 && !staff.includes(currentStaff)) {
          setCurrentStaff(staff[0]);
        } else if (staff.length === 0) {
          setCurrentStaff('');
        }
      }, [staff, currentStaff]);

      const cartQtyByItemId = useMemo(() => {
        const map = {};
        cart.forEach(c => {
          if (!c.isDiscount && c.id !== undefined) {
            map[c.id] = (map[c.id] || 0) + (c.quantity || 1);
          }
        });
        return map;
      }, [cart]);

      const getAvailableStock = (item) => {
        const maxStock = Number(item.stock) || 0;
        const inCart = cartQtyByItemId[item.id] || 0;
        return Math.max(0, maxStock - inCart);
      };

      const categories = useMemo(() => {
        const cats = new Set(['すべて']);
        items.forEach(i => {
          if (i.category && i.category.trim()) cats.add(i.category.trim());
        });
        return Array.from(cats);
      }, [items]);

      const handleItemClick = (item) => {
        if (getAvailableStock(item) <= 0) {
          showToast(`「${item.name}」は在庫上限までカートに入っています`, 'error');
          return;
        }
        if (item.flavors && item.flavors.length > 0) {
          setFlavorModal({ isOpen: true, item });
        } else {
          addToCart(item, null);
        }
      };

      const addToCart = (item, flavor) => {
        if (getAvailableStock(item) <= 0) {
          showToast(`「${item.name}」の在庫が足りません`, 'error');
          setFlavorModal({ isOpen: false, item: null });
          return;
        }

        setCart(prevCart => {
          const existingIndex = prevCart.findIndex(
            c => !c.isDiscount && c.id === item.id && (c.selectedFlavor || null) === (flavor || null)
          );
          if (existingIndex > -1) {
            const updated = [...prevCart];
            updated[existingIndex] = {
              ...updated[existingIndex],
              quantity: (updated[existingIndex].quantity || 1) + 1
            };
            return updated;
          } else {
            return [
              ...prevCart,
              {
                ...item,
                price: Number(item.price) || 0,
                cartItemId: `${item.id}-${flavor || 'default'}-${Date.now()}`,
                selectedFlavor: flavor,
                quantity: 1,
                returnedQuantity: 0,
                isDiscount: false
              }
            ];
          }
        });
        setFlavorModal({ isOpen: false, item: null });
      };

      const updateCartQuantity = (cartItemId, delta) => {
        setCart(prevCart => {
          return prevCart.map(cItem => {
            if (cItem.cartItemId !== cartItemId) return cItem;
            const newQty = (cItem.quantity || 1) + delta;
            if (newQty <= 0) return null;

            if (delta > 0 && !cItem.isDiscount) {
              const originalItem = items.find(i => i.id === cItem.id);
              if (originalItem) {
                const currentInCartTotal = cartQtyByItemId[cItem.id] || 0;
                if (currentInCartTotal + delta > (Number(originalItem.stock) || 0)) {
                  showToast(`「${cItem.name}」の在庫上限（残${originalItem.stock}）に達しています`, 'error');
                  return cItem;
                }
              }
            }
            return { ...cItem, quantity: newQty };
          }).filter(Boolean);
        });
      };

      const removeFromCart = (cartItemId) => {
        setCart(cart.filter(item => item.cartItemId !== cartItemId));
      };

      const applyDiscount = () => {
        const amountNum = Number(discountModal.amount);
        if (amountNum > 0) {
          const discountItem = {
            cartItemId: `discount-${Date.now()}`,
            name: '値引き・サービス',
            price: -amountNum,
            quantity: 1,
            returnedQuantity: 0,
            isDiscount: true,
            category: '割引'
          };
          setCart([...cart, discountItem]);
          setLastDiscountAmount(String(amountNum));
          setDiscountModal({ ...discountModal, isOpen: false });
          showToast(`¥${amountNum.toLocaleString()} の値引きを適用しました`, 'success');
        }
      };

      const cartTotal = useMemo(() => {
        const raw = cart.reduce((sum, item) => sum + (Number(item.price) || 0) * (item.quantity || 1), 0);
        return Math.max(0, raw);
      }, [cart]);

      const cartTotalCount = useMemo(() => {
        return cart.reduce((sum, item) => sum + (item.isDiscount ? 0 : (item.quantity || 1)), 0);
      }, [cart]);

      const openCheckout = () => {
        if (cart.length === 0) return;
        setMobileCartOpen(false);
        setCheckoutModal({ isOpen: true, received: '' });
      };

      const processCheckout = () => {
        const receivedNum = Number(checkoutModal.received) || 0;
        if (receivedNum < cartTotal) {
          showToast('お預かり金額が合計金額に足りていません', 'error');
          return;
        }

        const staffName = currentStaff || '担当者未設定';
        const nowIso = new Date().toISOString();

        const newSale = {
          id: Date.now(),
          timeIso: nowIso,
          items: cart.map(c => ({ ...c, returnedQuantity: 0 })),
          total: cartTotal,
          received: receivedNum,
          change: receivedNum - cartTotal,
          staff: staffName,
          status: 'valid', // 'valid', 'cancelled', 'partially_refunded'
          isCancelled: false,
          refundAmount: 0,
          cancelReason: '',
          refundEvents: []
        };

        // 在庫減算
        const updatedItems = items.map(item => {
          const soldCount = cartQtyByItemId[item.id] || 0;
          if (soldCount > 0) {
            return { ...item, stock: Math.max(0, (Number(item.stock) || 0) - soldCount) };
          }
          return item;
        });

        const nextHistory = [...salesHistory, newSale];
        const nextValidCount = nextHistory.filter(s => !s.isCancelled && s.status !== 'cancelled').length;

        setItems(updatedItems);
        setSalesHistory(nextHistory);
        setCart([]);
        setCheckoutModal({ isOpen: false, received: '' });
        showToast(`会計完了！ お釣り: ¥${(receivedNum - cartTotal).toLocaleString()}`, 'success');

        // キリ番ラッキー演出
        const interval = Number(luckyConfig.interval) || 10;
        if (
          luckyConfig.enabled &&
          interval > 0 &&
          nextValidCount > 0 &&
          nextValidCount % interval === 0 &&
          !(luckyConfig.triggeredMilestones || []).includes(nextValidCount)
        ) {
          setLuckyConfig(prev => ({
            ...prev,
            triggeredMilestones: [...(prev.triggeredMilestones || []), nextValidCount]
          }));
          setLuckyModal({
            isOpen: true,
            message: `🎊おめでとうございます！🎊\n本日 ${nextValidCount} 組目のお客様です！\nトッピング無料やおまけなどのサービスをどうぞ！`
          });
        }
      };

      const handleNumpadClick = (val, mode = 'append') => {
        setCheckoutModal(prev => {
          let currentStr = String(prev.received || '');
          const currentNum = Number(currentStr) || 0;

          if (val === 'C') return { ...prev, received: '' };
          if (val === 'BS') return { ...prev, received: currentStr.slice(0, -1) };
          if (val === 'EXACT') return { ...prev, received: String(cartTotal) };

          if (mode === 'add') {
            const nextVal = Math.min(9999999, currentNum + Number(val));
            return { ...prev, received: String(nextVal) };
          }

          if (typeof val === 'number') {
            const nextVal = currentNum > 0 && currentNum + val <= 9999999 ? currentNum + val : val;
            return { ...prev, received: String(nextVal) };
          }

          if (currentStr === '0' && val !== '00') currentStr = '';
          if (currentStr === '' && (val === '0' || val === '00')) return { ...prev, received: '0' };
          if (currentStr.length >= 7) return prev;
          return { ...prev, received: currentStr + val };
        });
      };

      const getSaleNetTotal = (sale) => {
        if (sale.isCancelled || sale.status === 'cancelled') return 0;
        const refunded = Number(sale.refundAmount) || 0;
        return Math.max(0, (Number(sale.total) || 0) - refunded);
      };

      const lastActiveSale = useMemo(() => {
        return [...salesHistory].reverse().find(s => !s.isCancelled && s.status !== 'cancelled');
      }, [salesHistory]);

      const salesMetrics = useMemo(() => {
        let grossSales = 0;
        let totalRefunded = 0;
        let netSales = 0;
        let validTransactions = 0;
        let cancelledTransactions = 0;

        salesHistory.forEach(sale => {
          if (sale.isCancelled || sale.status === 'cancelled') {
            cancelledTransactions += 1;
            totalRefunded += Number(sale.total) || 0;
          } else {
            validTransactions += 1;
            grossSales += Number(sale.total) || 0;
            const ref = Number(sale.refundAmount) || 0;
            totalRefunded += ref;
            netSales += Math.max(0, (Number(sale.total) || 0) - ref);
          }
        });

        return { grossSales, totalRefunded, netSales, validTransactions, cancelledTransactions };
      }, [salesHistory]);

      const goalProgress = Math.min(goalAmount > 0 ? (salesMetrics.netSales / goalAmount) * 100 : 0, 100);

      const hourlyData = useMemo(() => {
        const hours = Array(13).fill(0).map((_, i) => ({ hour: i + 8, sales: 0, count: 0 }));
        salesHistory.forEach(sale => {
          if (sale.isCancelled || sale.status === 'cancelled') return;
          const d = new Date(sale.timeIso || sale.time);
          if (!isNaN(d.getTime())) {
            const hour = d.getHours();
            const target = hours.find(h => h.hour === hour);
            if (target) {
              target.sales += getSaleNetTotal(sale);
              target.count += 1;
            }
          }
        });
        return hours;
      }, [salesHistory]);

      const maxHourlySales = Math.max(...hourlyData.map(d => d.sales), 1000);

      const staffRanking = useMemo(() => {
        const rankingMap = {};
        staff.forEach(s => { rankingMap[s] = { name: s, sales: 0, count: 0 }; });
        salesHistory.forEach(sale => {
          if (sale.isCancelled || sale.status === 'cancelled') return;
          const sName = sale.staff || '担当者未設定';
          if (!rankingMap[sName]) rankingMap[sName] = { name: sName, sales: 0, count: 0 };
          rankingMap[sName].sales += getSaleNetTotal(sale);
          rankingMap[sName].count += 1;
        });
        return Object.values(rankingMap).sort((a, b) => b.sales - a.sales);
      }, [salesHistory, staff]);

      const productRanking = useMemo(() => {
        const map = {};
        salesHistory.forEach(sale => {
          if (sale.isCancelled || sale.status === 'cancelled') return;
          (sale.items || []).forEach(cItem => {
            if (cItem.isDiscount) return;
            const originalQty = cItem.quantity || 1;
            const retQty = cItem.returnedQuantity || 0;
            const netQty = Math.max(0, originalQty - retQty);
            if (netQty <= 0) return;

            const key = cItem.selectedFlavor ? `${cItem.name}（${cItem.selectedFlavor}）` : cItem.name;
            if (!map[key]) {
              map[key] = {
                key,
                name: cItem.name,
                flavor: cItem.selectedFlavor || null,
                qty: 0,
                revenue: 0
              };
            }
            map[key].qty += netQty;
            map[key].revenue += (Number(cItem.price) || 0) * netQty;
          });
        });
        return Object.values(map).sort((a, b) => b.qty - a.qty || b.revenue - a.revenue);
      }, [salesHistory]);

      const openRefundModal = (sale, defaultMode = 'full') => {
        const initialReturnQty = {};
        (sale.items || []).forEach(item => {
          if (!item.isDiscount) {
            initialReturnQty[item.cartItemId] = 0;
          }
        });

        setRefundModal({
          isOpen: true,
          sale,
          mode: defaultMode,
          returnQuantities: initialReturnQty,
          restock: true,
          reason: REFUND_REASONS[0],
          customReason: ''
        });
      };

      const handleExecuteRefund = () => {
        const sale = refundModal.sale;
        if (!sale) return;

        const effectiveReason = refundModal.reason === 'その他' && refundModal.customReason.trim()
          ? `その他: ${refundModal.customReason.trim()}`
          : refundModal.reason;

        const nowIso = new Date().toISOString();

        if (refundModal.mode === 'full') {
          // 全額取消
          if (refundModal.restock) {
            setItems(prevItems => {
              return prevItems.map(item => {
                const countToRestore = (sale.items || [])
                  .filter(c => !c.isDiscount && c.id === item.id)
                  .reduce((sum, c) => {
                    const remainingActive = (c.quantity || 1) - (c.returnedQuantity || 0);
                    return sum + Math.max(0, remainingActive);
                  }, 0);
                if (countToRestore > 0 && item.stock !== '') {
                  return { ...item, stock: (Number(item.stock) || 0) + countToRestore };
                }
                return item;
              });
            });
          }

          setSalesHistory(prevHistory => {
            return prevHistory.map(s => {
              if (s.id !== sale.id) return s;
              const refundAmt = Math.max(0, (Number(s.total) || 0) - (Number(s.refundAmount) || 0));
              const newEvent = {
                id: Date.now(),
                timeIso: nowIso,
                type: 'full_cancellation',
                refundAmount: refundAmt,
                reason: effectiveReason,
                restocked: refundModal.restock,
                staff: currentStaff || s.staff
              };
              return {
                ...s,
                isCancelled: true,
                status: 'cancelled',
                refundAmount: s.total,
                cancelReason: effectiveReason,
                refundEvents: [...(s.refundEvents || []), newEvent]
              };
            });
          });

          setRefundModal(p => ({ ...p, isOpen: false, sale: null }));
          showToast(`取引を取り消しました（返金額: ¥${getSaleNetTotal(sale).toLocaleString()}）`, 'success');

        } else {
          // 一部返品・部分返金
          let totalRefundCalc = 0;
          const restoredItemCounts = {};
          const updatedItems = (sale.items || []).map(item => {
            if (item.isDiscount) return item;
            const qtyToReturn = refundModal.returnQuantities[item.cartItemId] || 0;
            if (qtyToReturn > 0) {
              totalRefundCalc += (Number(item.price) || 0) * qtyToReturn;
              restoredItemCounts[item.id] = (restoredItemCounts[item.id] || 0) + qtyToReturn;
              return {
                ...item,
                returnedQuantity: (item.returnedQuantity || 0) + qtyToReturn
              };
            }
            return item;
          });

          if (totalRefundCalc <= 0) {
            showToast('返品する商品の数量を選択してください', 'error');
            return;
          }

          if (refundModal.restock) {
            setItems(prevItems => {
              return prevItems.map(item => {
                const countToAdd = restoredItemCounts[item.id] || 0;
                if (countToAdd > 0 && item.stock !== '') {
                  return { ...item, stock: (Number(item.stock) || 0) + countToAdd };
                }
                return item;
              });
            });
          }

          setSalesHistory(prevHistory => {
            return prevHistory.map(s => {
              if (s.id !== sale.id) return s;
              const newTotalRefunded = (Number(s.refundAmount) || 0) + totalRefundCalc;
              const isAllRefunded = newTotalRefunded >= s.total;
              const newEvent = {
                id: Date.now(),
                timeIso: nowIso,
                type: 'partial_refund',
                refundAmount: totalRefundCalc,
                returnedItems: Object.entries(refundModal.returnQuantities)
                  .filter(([_, q]) => q > 0)
                  .map(([cartItemId, q]) => {
                    const original = s.items.find(i => i.cartItemId === cartItemId);
                    return { name: original?.name || '', quantity: q, price: original?.price || 0 };
                  }),
                reason: effectiveReason,
                restocked: refundModal.restock,
                staff: currentStaff || s.staff
              };

              return {
                ...s,
                items: updatedItems,
                refundAmount: newTotalRefunded,
                status: isAllRefunded ? 'cancelled' : 'partially_refunded',
                isCancelled: isAllRefunded,
                refundEvents: [...(s.refundEvents || []), newEvent]
              };
            });
          });

          setRefundModal(p => ({ ...p, isOpen: false, sale: null }));
          showToast(`一部返品を処理しました（返金: ¥${totalRefundCalc.toLocaleString()}）`, 'success');
        }
      };

      const handleRestoreSale = (sale) => {
        if (!sale) return;

        setItems(prevItems => {
          return prevItems.map(item => {
            const soldCount = (sale.items || [])
              .filter(c => !c.isDiscount && c.id === item.id)
              .reduce((sum, c) => sum + (c.quantity || 1), 0);
            if (soldCount > 0 && item.stock !== '') {
              return { ...item, stock: Math.max(0, (Number(item.stock) || 0) - soldCount) };
            }
            return item;
          });
        });

        setSalesHistory(prevHistory => {
          return prevHistory.map(s => {
            if (s.id !== sale.id) return s;
            return {
              ...s,
              isCancelled: false,
              status: 'valid',
              refundAmount: 0,
              items: (s.items || []).map(i => ({ ...i, returnedQuantity: 0 }))
            };
          });
        });

        setRefundModal(p => ({ ...p, isOpen: false, sale: null }));
        showToast('取消を解除し、取引を有効な状態に復元しました', 'info');
      };

      const handleExportCSV = () => {
        if (salesHistory.length === 0) {
          showToast('出力する売上データがありません', 'error');
          return;
        }
        const headers = ['取引日時', '注文内容', '合計点数', '元合計金額', '返金額', '純売上', 'お預かり', 'お釣り', '担当スタッフ', 'ステータス', '返金・取消理由'];
        const data = salesHistory.map(sale => {
          const d = new Date(sale.timeIso || sale.time);
          const timeStr = !isNaN(d.getTime()) ? d.toLocaleString('ja-JP') : '';
          const itemsStr = (sale.items || []).map(item => {
            const qty = item.quantity || 1;
            const ret = item.returnedQuantity || 0;
            let name = item.name;
            if (item.isDiscount) name = `【割引】${name}`;
            if (item.selectedFlavor) name += `(${item.selectedFlavor})`;
            if (ret > 0) return `${name}×${qty}(内返品${ret})`;
            return `${name}×${qty}`;
          }).join(' / ');
          
          const net = getSaleNetTotal(sale);
          const itemCount = (sale.items || []).reduce((s, i) => s + (i.isDiscount ? 0 : (i.quantity || 1)), 0);
          let statusText = '有効';
          if (sale.isCancelled || sale.status === 'cancelled') statusText = '全額取消済';
          else if (sale.status === 'partially_refunded') statusText = '一部返品済';

          const reason = sale.cancelReason || (sale.refundEvents && sale.refundEvents.length > 0 ? sale.refundEvents[0].reason : '');

          return `"${timeStr}","${itemsStr}",${itemCount},${sale.total},${sale.refundAmount || 0},${net},${sale.received || sale.total},${sale.change || 0},"${sale.staff}","${statusText}","${reason}"`;
        });
        
        const csvContent = [headers.join(','), ...data].join('\n');
        const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `${csvFileName || '学祭売上データ'}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('CSVファイルをダウンロードしました', 'success');
      };

      const navItems = [
        { id: 'register', label: 'レジ', icon: <Calculator size={22} /> },
        { id: 'dashboard', label: '集計', icon: <BarChart3 size={22} /> },
        { id: 'close', label: 'レジ締め', icon: <ClipboardCheck size={22} /> },
        { id: 'settings', label: '設定', icon: <Settings size={22} /> },

                  <span className="font-black text-indigo-900">¥{getSaleNetTotal(lastActiveSale).toLocaleString()}</span>
                  <span className="hidden sm:inline text-slate-600 truncate">
                    ({(lastActiveSale.items || []).map(i => `${i.name}×${i.quantity || 1}`).join(', ')})
                  </span>
                </div>
                <div className="flex items-center gap-1 shrink-0 ml-2">
                  <button 
                    onClick={() => openRefundModal(lastActiveSale, 'full')}
                    className="bg-white hover:bg-rose-50 text-rose-600 border border-rose-200 hover:border-rose-300 font-black px-2.5 py-1 rounded-lg flex items-center shadow-xs transition-colors active:scale-95"

                    <RotateCcw size={13} className="mr-1" /> 直前取引を取り消す / 返金
                  </button>
                </div>
              </div>
            )}

            {/* 各タブの切り替えメインエリア */}
            <main className="flex-1 overflow-hidden flex flex-col">
              {activeTab === 'register' && (
                <div className="flex flex-col md:flex-row h-full relative">
                  {/* 左側：商品グリッド */}
                  <div className="flex-1 flex flex-col overflow-hidden bg-slate-50 md:border-r border-slate-200">

                      )}
                    </div>
                  </div>

                  {/* モバイル用：下部フローティングカートバー */}

    function CashierCloseTab({ salesMetrics, startCounts, setStartCounts, endCounts, setEndCounts }) {
      const moneyTypes = [
        { key: 'c10000', label: '10,000円', val: 10000 },
        { key: 'c5000', label: '5,000円', val: 5000 },
        { key: 'c1000', label: '1,000円', val: 1000 },
        { key: 'c500', label: '500円', val: 500 },
        { key: 'c100', label: '100円', val: 100 },
        { key: 'c50', label: '50円', val: 50 },
        { key: 'c10', label: '10円', val: 10 },
        { key: 'c5', label: '5円', val: 5 },
        { key: 'c1', label: '1円', val: 1 },
      ];

      const handleCountChange = (setter, counts, key, val) => {
        if (val === '') {
          setter({ ...counts, [key]: '' });
          return;
        }
        const num = Math.max(0, parseInt(val, 10));
        if (!isNaN(num)) setter({ ...counts, [key]: num });
      };

      const startCashTotal = moneyTypes.reduce((sum, mt) => sum + ((Number(startCounts[mt.key]) || 0) * mt.val), 0);
      const endCashTotal = moneyTypes.reduce((sum, mt) => sum + ((Number(endCounts[mt.key]) || 0) * mt.val), 0);
      
      const expectedCash = startCashTotal + salesMetrics.netSales;
      const difference = endCashTotal - expectedCash;

      return (
        <div className="p-4 md:p-6 h-full overflow-y-auto bg-slate-50 pb-24 md:pb-8 flex justify-center">
          <div className="w-full max-w-5xl">

                      <div className="flex items-center space-x-2">

                    <div className="bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                      <div className="text-[11px] font-bold text-indigo-500">実際のレジ内現金 (実測)</div>
                      <div className="flex justify-between font-black text-indigo-700 text-xl mt-0.5">
                        <span>実測値</span>
                        <span>¥{endCashTotal.toLocaleString()}</span>
                      </div>
                    </div>
                  </div>
                </div>
                
                <div className={`mt-5 p-4 rounded-2xl text-center border-2 ${
                  difference === 0 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-600 border-rose-200'
                }`}>
                  {difference === 0 ? (
                    <div className="flex flex-col items-center justify-center">
                      <Check size={28} className="mb-1 text-emerald-500" /> 
                      <span className="font-black text-base">誤差なし！ピッタリ一致</span>
                      <span className="text-[11px] text-emerald-600 mt-0.5 font-bold">売上と返金・出金が完璧に合致しています</span>
                    </div>
                  ) : (
                    <div className="flex flex-col items-center">
                      <div className="flex items-center text-xs mb-1 font-bold"><AlertCircle size={15} className="mr-1" /> レジ現金に過不足が発生しています</div>
                      <span className="text-2xl sm:text-3xl font-black">{difference > 0 ? '+' : ''}{difference.toLocaleString()} 円</span>
                      <span className="text-[11px] text-rose-500 mt-1 font-bold">
                        {difference > 0 ? '（現金が多い：お釣りの渡し忘れ等）' : '（現金が足りない：返金控え忘れやお釣りの渡しすぎ等）'}
                      </span>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function SettingsTab({
      items, setItems, staff, setStaff, goalAmount, setGoalAmount,
      luckyConfig, setLuckyConfig, salesHistory, setSalesHistory,
      startCashCounts, setStartCashCounts, endCashCounts, setEndCashCounts, showToast
    }) {
      const [newStaffName, setNewStaffName] = useState('');
      const [resetConfirmOpen, setResetConfirmOpen] = useState(false);
      const fileInputRef = useRef(null);

      const handleAddItem = () => {
        const newItem = {
          id: Date.now() + Math.floor(Math.random() * 1000),
          name: '',
          price: 300,
          stock: 50,
          category: 'フード',
          flavors: [],
          _rawFlavors: '',
          image: null
        };
        setItems([...items, newItem]);
      };

      const handleRemoveItem = (id) => setItems(items.filter(item => item.id !== id));
      
      const updateItemField = (id, field, value) => {
        setItems(items.map(item => {
          if (item.id === id) {
            if (field === 'flavors_str') {
              const parsed = value.split(/[,、]/).map(s => s.trim()).filter(Boolean);
              return { ...item, flavors: parsed, _rawFlavors: value };
            }
            return { ...item, [field]: value };
          }
          return item;
        }));
      };

      const handleImageUpload = async (id, event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          const compressedDataUrl = await compressImageFile(file, 240, 0.75);
          updateItemField(id, 'image', compressedDataUrl);
          showToast('商品画像を設定しました', 'success');
        } catch (err) {
          showToast('画像の読み込みに失敗しました', 'error');
        }
      };

      // 予算シミュレーター(festival_incomes)からの引き継ぎ
      const handleImportFromBudgetStorage = () => {
        const savedIncomes = safeStorage.get('festival_incomes');
        if (!savedIncomes || !Array.isArray(savedIncomes) || savedIncomes.length === 0) {
          showToast('ブラウザ内に予算シミュレーターのデータが見つかりません。JSON読込をお試しください。', 'error');
          return;
        }
        const validIncomes = savedIncomes.filter(inc => inc.name && inc.name.trim() !== '');
        if (validIncomes.length === 0) {
          showToast('予算シミュレーターに有効な商品名が登録されていません', 'error');
          return;
        }
        const converted = validIncomes.map((inc, idx) => ({
          id: Date.now() + idx,
          name: inc.name.trim(),
          price: Number(inc.price) || 0,
          stock: Number(inc.quantity) || 50,
          category: 'フード',
          flavors: [],
          _rawFlavors: '',
          image: null
        }));
        const sumGoal = converted.reduce((s, i) => s + (i.price * i.stock), 0);
        setItems(converted);
        if (sumGoal > 0) setGoalAmount(sumGoal);
        showToast(`予算シミュレーターから ${converted.length} 件の商品と目標売上を引き継ぎました！`, 'success');
      };

      // バックアップJSONの保存
      const handleExportBackupJSON = () => {
        const payload = {
          type: 'festival_pos_backup',
          version: '3.1',
          exportedAt: new Date().toISOString(),
          items,
          salesHistory,
          staff,
          goalAmount,
          startCashCounts,
          endCashCounts,
          luckyConfig
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `学祭POSバックアップ_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('バックアップファイル(.json)を保存しました', 'success');
      };

      // JSONファイルの読込（POSバックアップと予算シミュレーターJSONの両対応）
      const handleImportJSONFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (Array.isArray(data.items)) {
              setItems(data.items);
              if (Array.isArray(data.salesHistory)) setSalesHistory(data.salesHistory);
              if (Array.isArray(data.staff)) setStaff(data.staff);
              if (typeof data.goalAmount === 'number') setGoalAmount(data.goalAmount);
              if (data.startCashCounts) setStartCashCounts({ ...EMPTY_CASH_COUNTS, ...data.startCashCounts });
              if (data.endCashCounts) setEndCashCounts({ ...EMPTY_CASH_COUNTS, ...data.endCashCounts });
              if (data.luckyConfig) setLuckyConfig(data.luckyConfig);
              showToast('POSバックアップデータを復元しました！', 'success');
            } else if (Array.isArray(data.incomes)) {
              const converted = data.incomes
                .filter(inc => inc.name && inc.name.trim() !== '')
                .map((inc, idx) => ({
                  id: Date.now() + idx,
                  name: inc.name.trim(),
                  price: Number(inc.price) || 0,
                  stock: Number(inc.quantity) || 50,
                  category: 'フード',
                  flavors: [],
                  _rawFlavors: '',
                  image: null
                }));
              const sumGoal = converted.reduce((s, i) => s + (i.price * i.stock), 0);
              setItems(converted);
              if (sumGoal > 0) setGoalAmount(sumGoal);
              showToast(`予算シミュレーターJSONから ${converted.length} 件の商品をインポートしました！`, 'success');
            } else {
              showToast('未対応のJSONファイルです', 'error');
            }
          } catch (err) {
            showToast('ファイルの読み込みに失敗しました', 'error');
          }
          e.target.value = '';
        };
        reader.readAsText(file);
      };

      const handleAddStaff = () => {
        const trimmed = newStaffName.trim();
        if (trimmed && !staff.includes(trimmed)) {
          setStaff([...staff, trimmed]);
          setNewStaffName('');
        }
      };

      const handleResetAll = () => {
        safeStorage.remove(STORAGE_KEY);
        setItems([]);
        setSalesHistory([]);
        setStaff([]);
        setGoalAmount(50000);
        setStartCashCounts(EMPTY_CASH_COUNTS);
        setEndCashCounts(EMPTY_CASH_COUNTS);
        setLuckyConfig({ enabled: true, interval: 10, triggeredMilestones: [] });
        setResetConfirmOpen(false);
        showToast('すべてのデータを初期化しました', 'info');
      };

      return (
        <div className="p-4 md:p-6 h-full overflow-y-auto bg-slate-50 pb-24 md:pb-10">
          <input type="file" accept=".json" ref={fileInputRef} onChange={handleImportJSONFile} className="hidden" />
          <div className="max-w-6xl mx-auto space-y-6">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
              <h2 className="text-2xl font-black flex items-center text-slate-800 tracking-tight">
                <Settings className="mr-2.5 text-indigo-600" size={26}/> 設定・商品・データ管理
              </h2>
              <div className="flex flex-wrap gap-2">
                <button
                  onClick={handleImportFromBudgetStorage}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-black flex items-center shadow-xs transition-colors active:scale-95"
                >
                  <Sparkles size={15} className="mr-1.5" /> 予算ツールから商品を引き継ぐ
                </button>
                <button
                  onClick={() => fileInputRef.current?.click()}
                  className="bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 px-3.5 py-2 rounded-xl text-xs font-black flex items-center shadow-xs transition-colors active:scale-95"
                >
                  <Upload size={15} className="mr-1.5" /> JSON読込 (予算/POS)
                </button>
                <button
                  onClick={handleExportBackupJSON}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-xs font-black flex items-center shadow-xs transition-colors active:scale-95"
                >
                  <Download size={15} className="mr-1.5" /> バックアップ保存
                </button>
                <button
                  onClick={() => setResetConfirmOpen(true)}
                  className="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-3.5 py-2 rounded-xl text-xs font-black flex items-center transition-colors active:scale-95"
                >
                  <RefreshCw size={14} className="mr-1" /> 全初期化
                </button>
              </div>
            </div>
            
            <div className="grid md:grid-cols-3 gap-6">
              <div className="bg-white p-5 rounded-2xl shadow-xs border border-slate-200">
                <h3 className="font-black text-slate-800 mb-3 flex items-center text-sm">
                  <Target size={18} className="mr-2 text-indigo-500"/> 目標売上金額
                </h3>
                <div className="relative">
                  <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 font-black">¥</span>
                  <input 
                    type="number" value={goalAmount} onChange={(e) => setGoalAmount(Number(e.target.value) || 0)}
                    className="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white font-black text-lg outline-none"
                  />
                </div>
                <p className="text-[11px] text-slate-400 mt-2 font-bold">※ヘッダーと集計画面の進捗バーに連動します</p>
              </div>

              <div className="bg-white p-5 rounded-2xl shadow-xs border border-slate-200">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-black text-slate-800 flex items-center text-sm">
                    <Trophy size={18} className="mr-2 text-amber-500"/> キリ番ラッキー演出
                  </h3>
                  <label className="inline-flex items-center cursor-pointer">
                    <input
                      type="checkbox"
                      checked={luckyConfig.enabled}
                      onChange={(e) => setLuckyConfig({ ...luckyConfig, enabled: e.target.checked })}
                      className="sr-only peer"
                    />
                    <div className="w-10 h-5 bg-slate-200 rounded-full peer peer-checked:bg-indigo-600 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all relative"></div>
                  </label>
                </div>
                <div className="flex items-center space-x-2">
                  <span className="text-xs font-bold text-slate-600">会計</span>
                  <input
                    type="number"
                    min="1"
                    disabled={!luckyConfig.enabled}
                    value={luckyConfig.interval}
                    onChange={(e) => setLuckyConfig({ ...luckyConfig, interval: Math.max(1, Number(e.target.value) || 10) })}
                    className="w-20 p-2 bg-slate-50 border border-slate-200 rounded-xl text-center font-black text-base outline-none disabled:opacity-50"
                  />
                  <span className="text-xs font-bold text-slate-600">組ごとに祝福演出</span>
                </div>
              </div>

              <div className="bg-white p-5 rounded-2xl shadow-xs border border-slate-200">
                <h3 className="font-black text-slate-800 mb-3 flex items-center text-sm">
                  <User size={18} className="mr-2 text-indigo-500"/> レジ担当スタッフ登録
                </h3>
                <div className="flex space-x-2 mb-3">
                  <input 
                    type="text" value={newStaffName} onChange={(e) => setNewStaffName(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleAddStaff()}
                    placeholder="例: 佐藤 / A班"
                    className="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                  <button onClick={handleAddStaff} className="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-xs font-black whitespace-nowrap active:scale-95">追加</button>
                </div>
                <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto">
                  {staff.map((s, idx) => (
                    <div key={idx} className="flex items-center bg-slate-100 rounded-lg px-2.5 py-1 text-xs font-bold text-slate-700">
                      <span>{s}</span>
                      <button onClick={() => setStaff(staff.filter((_, i) => i !== idx))} className="ml-1.5 text-slate-400 hover:text-rose-500">
                        <X size={13} />
                      </button>
                    </div>
                  ))}
                  {staff.length === 0 && <span className="text-xs text-slate-400 font-bold">スタッフ未登録</span>}
                </div>
              </div>
            </div>

            {/* 商品メニュー設定テーブル */}
            <div className="bg-white p-5 rounded-2xl shadow-xs border border-slate-200">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                <div>
                  <h3 className="font-black text-slate-800 flex items-center text-base">
                    <ShoppingCart size={20} className="mr-2 text-indigo-500"/> 商品メニュー・在庫設定
                  </h3>
                  <p className="text-xs text-slate-400 mt-0.5 font-bold">
                    種類・味は「ソース、塩」のように読点（、）またはカンマ（,）区切りで設定できます
                  </p>
                </div>
                <div className="flex gap-2 w-full sm:w-auto">
                  {items.length === 0 && (
                    <button
                      onClick={() => { setItems(SAMPLE_ITEMS); showToast('サンプル商品を追加しました', 'success'); }}
                      className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3.5 py-2 rounded-xl text-xs font-black flex items-center justify-center flex-1 sm:flex-initial"
                    >
                      サンプル読込
                    </button>
                  )}
                  <button onClick={handleAddItem} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-black flex items-center justify-center flex-1 sm:flex-initial shadow-xs active:scale-95">
                    <Plus size={16} className="mr-1" /> 商品を追加
                  </button>
                </div>
              </div>
              
              <div className="overflow-x-auto rounded-xl border border-slate-200">
                <table className="w-full text-left text-xs sm:text-sm whitespace-nowrap">
                  <thead className="bg-slate-50 text-slate-500 border-b border-slate-200 text-xs">
                    <tr>
                      <th className="p-3 w-14 text-center font-bold">画像</th>
                      <th className="p-3 w-44 font-bold">商品名</th>
                      <th className="p-3 w-28 font-bold">カテゴリ</th>
                      <th className="p-3 w-24 font-bold">単価 (円)</th>
                      <th className="p-3 w-24 font-bold">現在庫</th>
                      <th className="p-3 font-bold">種類・味（、または , 区切り）</th>
                      <th className="p-3 w-12 text-center font-bold">削除</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {items.map(item => (
                      <tr key={item.id} className="hover:bg-indigo-50/20">
                        <td className="p-2.5 text-center">
                          <label className="cursor-pointer inline-flex justify-center">
                            {item.image ? (
                              <div className="relative group">
                                <img src={item.image} alt="preview" className="w-11 h-11 object-cover rounded-xl border border-slate-200" />
                                <div className="absolute inset-0 bg-black/50 rounded-xl flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                  <Edit2 size={13} className="text-white" />
                                </div>
                              </div>
                            ) : (
                              <div className="w-11 h-11 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center text-slate-400 hover:border-indigo-400 hover:text-indigo-500">
                                <Plus size={16} />
                              </div>
                            )}
                            <input type="file" accept="image/*" className="hidden" onChange={(e) => handleImageUpload(item.id, e)} />
                          </label>
                        </td>
                        <td className="p-2.5">
                          <input 
                            type="text" value={item.name} onChange={(e) => updateItemField(item.id, 'name', e.target.value)}
                            placeholder="例: 焼きそば"
                            className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg font-bold text-slate-800 focus:bg-white focus:border-indigo-400 outline-none"
                          />
                        </td>
                        <td className="p-2.5">
                          <input 
                            type="text" value={item.category} onChange={(e) => updateItemField(item.id, 'category', e.target.value)}
                            placeholder="例: フード"
                            className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-700 font-bold focus:bg-white focus:border-indigo-400 outline-none"
                          />
                        </td>
                        <td className="p-2.5">
                          <input 
                            type="number" min="0" value={item.price} onChange={(e) => updateItemField(item.id, 'price', e.target.value === '' ? '' : Number(e.target.value))}
                            placeholder="400"
                            className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-right font-black text-indigo-700 focus:bg-white focus:border-indigo-400 outline-none"
                          />
                        </td>
                        <td className="p-2.5">
                          <input 
                            type="number" min="0" value={item.stock} onChange={(e) => updateItemField(item.id, 'stock', e.target.value === '' ? '' : Number(e.target.value))}
                            placeholder="50"
                            className={`w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-right font-black outline-none focus:bg-white ${
                              item.stock !== '' && Number(item.stock) <= 0 ? 'text-rose-600 border-rose-300' : 'text-slate-800'
                            }`}
                          />
                        </td>
                        <td className="p-2.5">
                          <input 
                            type="text" 
                            value={item._rawFlavors !== undefined ? item._rawFlavors : (item.flavors ? item.flavors.join('、') : '')} 
                            onChange={(e) => updateItemField(item.id, 'flavors_str', e.target.value)}
                            placeholder="例: ソース、塩、激辛"
                            className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-700 font-bold focus:bg-white focus:border-indigo-400 outline-none"
                          />
                        </td>
                        <td className="p-2.5 text-center">
                          <button onClick={() => handleRemoveItem(item.id)} className="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors">
                            <Trash2 size={16} />
                          </button>
                        </td>
                      </tr>
                    ))}
                    {items.length === 0 && (
                      <tr><td colSpan="7" className="p-8 text-center text-slate-400 font-bold bg-slate-50/50">商品を追加してください</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          {/* 全初期化確認モーダル */}
          {resetConfirmOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-[9999] p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl animate-fade-in-up">
                <div className="flex items-center text-rose-600 mb-3">
                  <AlertCircle size={26} className="mr-2" />
                  <h3 className="text-lg font-black">全データの初期化</h3>
                </div>
                <p className="text-xs text-slate-600 font-bold leading-relaxed mb-6">
                  登録商品、売上履歴、スタッフ、レジ締め入力などすべてのデータを消去して初期化します。よろしいですか？
                </p>
                <div className="flex gap-3">
                  <button onClick={() => setResetConfirmOpen(false)} className="flex-1 py-3 bg-slate-100 text-slate-700 rounded-xl font-bold text-sm">キャンセル</button>
                  <button onClick={handleResetAll} className="flex-1 py-3 bg-rose-600 text-white rounded-xl font-black text-sm shadow-md">初期化する</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function HelpManualModal({ onClose }) {
      const [manualTab, setManualTab] = useState('quick');

      return (
        <div className="fixed inset-0 bg-slate-950/75 backdrop-blur-xs flex items-center justify-center z-[10000] p-3 sm:p-5">
          <div className="bg-white rounded-3xl w-full max-w-3xl shadow-2xl flex flex-col max-h-[92vh] overflow-hidden animate-fade-in-up border border-slate-200">
            {/* モーダルヘッダー */}
            <div className="bg-indigo-600 text-white p-4 sm:p-5 flex justify-between items-center shrink-0">
              <div className="flex items-center space-x-2.5">
                <BookOpen size={24} className="text-amber-300" />
                <div>
                  <h3 className="text-lg sm:text-xl font-black">学祭POS取扱説明書</h3>
                  <p className="text-xs text-indigo-100 font-bold">誰でもわかる！当日のレジ操作・返金・締め作業マニュアル</p>
                </div>
              </div>
              <button 
                onClick={onClose}
                className="p-2 bg-white/10 hover:bg-white/20 rounded-full text-white transition-colors"
              >
                <X size={20} />
              </button>
            </div>

            {/* マニュアル切り替えタブ */}
            <div className="flex border-b border-slate-200 bg-slate-50 px-3 pt-2 gap-1 overflow-x-auto shrink-0">
              {[
                { id: 'quick', label: '① 基本のレジ会計' },
                { id: 'refund', label: '② 返金・取消のやり方' },
                { id: 'close', label: '③ レジ締め・現金確認' },
                { id: 'data', label: '④ 予算連携・データ管理' },
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setManualTab(t.id)}
                  className={`px-3.5 py-2.5 font-black text-xs rounded-t-xl transition-all whitespace-nowrap ${
                    manualTab === t.id 
                      ? 'bg-white text-indigo-700 border-t-2 border-indigo-600 shadow-xs' 
                      : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>

            {/* マニュアル本文 */}
            <div className="p-4 sm:p-6 overflow-y-auto space-y-4 text-xs sm:text-sm text-slate-700 leading-relaxed">
              {manualTab === 'quick' && (
                <div className="space-y-4">
                  <div className="bg-indigo-50 border border-indigo-100 rounded-2xl p-4">
                    <h4 className="font-black text-indigo-900 text-sm mb-1 flex items-center">
                      <Calculator size={18} className="mr-1.5 text-indigo-600"/> レジの基本的な流れ（3ステップ）
                    </h4>
                    <p className="text-xs text-indigo-700 font-bold">混雑時でもスマートにお釣りを間違えずにお会計できます！</p>
                  </div>

                  <div className="grid sm:grid-cols-3 gap-3">
                    <div className="bg-white border border-slate-200 rounded-xl p-3.5 space-y-1.5 shadow-2xs">
                      <div className="w-6 h-6 rounded-full bg-indigo-600 text-white font-black text-xs flex items-center justify-center">1</div>
                      <div className="font-black text-slate-800 text-xs sm:text-sm">商品をタップして追加</div>
                      <p className="text-slate-500 text-xs">商品をタップするとカートに入ります。味がある商品は選択ポップアップが出ます。</p>
                    </div>
                    <div className="bg-white border border-slate-200 rounded-xl p-3.5 space-y-1.5 shadow-2xs">
                      <div className="w-6 h-6 rounded-full bg-indigo-600 text-white font-black text-xs flex items-center justify-center">2</div>
                      <div className="font-black text-slate-800 text-xs sm:text-sm">数量確認 ＆ お会計へ</div>
                      <p className="text-slate-500 text-xs">カート内の「＋」「ー」で個数調整。値引きがある場合は「値引きを追加」から適用します。</p>
                    </div>
                    <div className="bg-white border border-slate-200 rounded-xl p-3.5 space-y-1.5 shadow-2xs">
                      <div className="w-6 h-6 rounded-full bg-indigo-600 text-white font-black text-xs flex items-center justify-center">3</div>
                      <div className="font-black text-slate-800 text-xs sm:text-sm">お預かり金額を入力</div>
                      <p className="text-slate-500 text-xs">「ぴったり」や「+1,000」などのクイックボタン、またはテンキーでお預かり金額を入力し「確定」を押します。</p>
                    </div>
                  </div>

                  <div className="bg-amber-50 border border-amber-200 rounded-xl p-3.5 text-xs text-amber-900">
                    <span className="font-black">💡 お釣りの渡し間違い防止テクニック：</span><br/>
                    1,000円札を2枚預かったときは「¥2,000」ボタン、5,000円札なら「¥5,000」ボタンを押すだけで、お釣りが自動計算されて緑色で大きく表示されます。
                  </div>
                </div>
              )}

              {manualTab === 'refund' && (
                <div className="space-y-4">
                  <div className="bg-rose-50 border border-rose-100 rounded-2xl p-4">
                    <h4 className="font-black text-rose-900 text-sm mb-1 flex items-center">
                      <RotateCcw size={18} className="mr-1.5 text-rose-600"/> 返金・注文取消（トラブル即応）
                    </h4>
                    <p className="text-xs text-rose-700 font-bold">「打ち間違えた！」「やっぱり1個キャンセルで」に完全対応しています。</p>
                  </div>

                  <div className="space-y-3">
                    <div className="border border-slate-200 rounded-xl p-3.5 bg-white">
                      <div className="font-black text-slate-800 mb-1 flex items-center text-xs sm:text-sm">
                        <span className="bg-amber-500 text-white text-[10px] px-2 py-0.5 rounded font-black mr-2">即座に対応</span>
                        直前の会計を取り消したいとき
                      </div>
                      <p className="text-xs text-slate-600">
                        レジ画面の上部に「<strong>直前取引を取り消す / 返金</strong>」黄色バーが常時表示されています。タブを移動することなく、その場で1タップで取消画面を開けます。
                      </p>
                    </div>

                    <div className="border border-slate-200 rounded-xl p-3.5 bg-white">
                      <div className="font-black text-slate-800 mb-1 flex items-center text-xs sm:text-sm">
                        <span className="bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded font-black mr-2">一部返品</span>
                        「3個買ったうちの1個だけ返品」したいとき
                      </div>
                      <p className="text-xs text-slate-600">
                        返金モーダルで「<strong>一部商品の返品・部分返金</strong>」を選択します。返品したい商品の横にある「＋」を押して返品個数を指定すると、その商品代金のみが正確に返金計算されます。
                      </p>
                    </div>

                    <div className="border border-slate-200 rounded-xl p-3.5 bg-white">
                      <div className="font-black text-slate-800 mb-1 flex items-center text-xs sm:text-sm">
                        <span className="bg-emerald-600 text-white text-[10px] px-2 py-0.5 rounded font-black mr-2">重要</span>
                        「商品の在庫を元に戻す」スイッチの選び方
                      </div>
                      <ul className="text-xs text-slate-600 list-disc list-inside mt-1 space-y-1">
                        <li><strong>ON（戻す）：</strong> レジの打ち間違い、未開封で再販できるキャンセル。</li>
                        <li><strong>OFF（戻さない）：</strong> お客さんが落として破損したため返金した、焦がして破棄したなどの食品ロス時。</li>
                      </ul>
                    </div>

                    <div className="border border-slate-200 rounded-xl p-3.5 bg-white">
                      <div className="font-black text-slate-800 mb-1 flex items-center text-xs sm:text-sm">
                        <span className="bg-slate-700 text-white text-[10px] px-2 py-0.5 rounded font-black mr-2">復元</span>
                        間違えて取り消してしまった場合
                      </div>
                      <p className="text-xs text-slate-600">
                        集計タブの履歴で取消済み取引（薄い赤色）の「取消済（詳細/復元）」を押すと、「<strong>この取引を取り消し解除（復元）する</strong>」ボタンから元通りの売上・在庫に戻せます。
                      </p>
                    </div>
                  </div>
                </div>
              )}

              {manualTab === 'close' && (
                <div className="space-y-4">
                  <div className="bg-indigo-50 border border-indigo-100 rounded-2xl p-4">
                    <h4 className="font-black text-indigo-900 text-sm mb-1 flex items-center">
                      <ClipboardCheck size={18} className="mr-1.5 text-indigo-600"/> レジ締め・現金照合の手順
                    </h4>
                    <p className="text-xs text-indigo-700 font-bold">1日の終わり、またはシフト交代時の現金チェック手順です。</p>
                  </div>

                  <div className="space-y-3">
                    <div className="bg-white border border-slate-200 rounded-xl p-3.5">
                      <div className="font-black text-slate-800 text-xs sm:text-sm mb-1">
                        <span className="bg-slate-800 text-white text-[10px] px-2 py-0.5 rounded mr-1.5">Step 1</span>
                        開店時の「つり銭準備金」を入力しておく
                      </div>
                      <p className="text-xs text-slate-600">
                        最初に金庫に入れた小銭・千円札の枚数を入力します（例: 1,000円×10枚、100円×50枚など）。
                      </p>
                    </div>

                    <div className="bg-white border border-slate-200 rounded-xl p-3.5">
                      <div className="font-black text-slate-800 text-xs sm:text-sm mb-1">
                        <span className="bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded mr-1.5">Step 2</span>
                        営業終了時にレジ内の現金を数えて入力する
                      </div>
                      <p className="text-xs text-slate-600">
                        金庫・キャッシュトレイの中にあるお金を金種ごとに数えて枚数を入力します。
                      </p>
                    </div>

                    <div className="bg-white border border-slate-200 rounded-xl p-3.5">
                      <div className="font-black text-slate-800 text-xs sm:text-sm mb-1">
                        <span className="bg-emerald-600 text-white text-[10px] px-2 py-0.5 rounded mr-1.5">Step 3</span>
                        照合結果を確認する（誤差判定）
                      </div>
                      <p className="text-xs text-slate-600">
                        システムが自動で「<strong>準備金 ＋ 総売上 − 返金出金額 ＝ あるべき現金（理論値）</strong>」を計算します。
                        実測値と一致していれば「誤差なし！ピッタリ一致」と表示されます。
                      </p>
                    </div>
                  </div>
                </div>
              )}

              {manualTab === 'data' && (
                <div className="space-y-4">
                  <div className="bg-emerald-50 border border-emerald-100 rounded-2xl p-4">
                    <h4 className="font-black text-emerald-900 text-sm mb-1 flex items-center">
                      <Sparkles size={18} className="mr-1.5 text-emerald-600"/> 予算ツール連携 ＆ バックアップ
                    </h4>
                    <p className="text-xs text-emerald-700 font-bold">データはブラウザに自動保存されますが、ファイルとして安全に保管・共有できます。</p>
                  </div>

                  <div className="space-y-3">
                    <div className="bg-white border border-slate-200 rounded-xl p-3.5">
                      <div className="font-black text-slate-800 text-xs sm:text-sm mb-1">
                        ✨ 予算シミュレーターから商品を引き継ぐ
                      </div>
                      <p className="text-xs text-slate-600">
                        同じブラウザで「学園祭予算シミュレーター」を使用していた場合、「設定」タブの「<strong>予算ツールから商品を引き継ぐ</strong>」を押すだけで、商品名・単価・想定個数が一瞬でインポートされます。
                      </p>
                    </div>

                    <div className="bg-white border border-slate-200 rounded-xl p-3.5">
                      <div className="font-black text-slate-800 text-xs sm:text-sm mb-1">
                        💾 バックアップ保存 ＆ 他の端末への移行
                      </div>
                      <p className="text-xs text-slate-600">
                        「<strong>バックアップ保存</strong>」を押すと、設定・商品・売上履歴がまとまった <code>.json</code> ファイルがダウンロードされます。別のスマホやタブレットで「JSON読込」から開けば、同じ状態を復元できます。
                      </p>
                    </div>

                    <div className="bg-white border border-slate-200 rounded-xl p-3.5">
                      <div className="font-black text-slate-800 text-xs sm:text-sm mb-1">
                        📊 CSVエクスポート
                      </div>
                      <p className="text-xs text-slate-600">
                        集計タブから「<strong>CSV出力</strong>」を押すと、Excelでそのまま開ける形式（UTF-8 BOM付き）で全会計履歴・返金理由・担当スタッフ別データを出力できます。学祭後の反省会や会計報告書にそのまま使えます。
                      </p>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* モーダルフッター */}
            <div className="p-4 bg-slate-50 border-t border-slate-200 flex justify-end shrink-0">
              <button
                onClick={onClose}
                className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xs sm:text-sm rounded-xl shadow-xs transition-colors active:scale-95"
              >
               閉じる
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
